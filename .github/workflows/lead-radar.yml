name: Lead radar

on:
  schedule:
    - cron: "15 5 * * *"   # daily 05:15 UTC
  workflow_dispatch:
    inputs:
      days:
        description: "Look-back window in days"
        default: "2"
      llm:
        description: "Rate and draft with LLM (GitHub Models via GITHUB_TOKEN; or ANTHROPIC/OPENAI secret)"
        type: boolean
        default: true

permissions:
  contents: write
  models: read

concurrency:
  group: lead-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run radar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          DAYS="${{ github.event.inputs.days || '2' }}"
          LLM=""
          if [ "${{ github.event.inputs.llm || 'true' }}" = "true" ]; then LLM="--llm"; fi
          python3 leads/radar.py --days "$DAYS" $LLM
      - name: Commit digest and state
        run: |
          git config user.name "lead-radar[bot]"
          git config user.email "lead-radar@users.noreply.github.com"
          git add leads/digest leads/state
          git diff --cached --quiet && echo "nothing new" && exit 0
          git commit -m "leads: digest $(date -u +%F) [skip ci]"
          git push
